<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장애이해교육 퀴즈 챌린지</title>
    
    <!-- 파이어베이스 SDK 추가 -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            width: 95%;
            max-width: 600px;
            padding: 3rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            margin: 1rem auto;
        }
        
        h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-top: 0;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            word-break: keep-all;
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }
        
        input[type="text"], textarea {
            width: 70%;
            padding: 1rem;
            margin: 1.5rem 0;
            border: 2px solid #E5E7EB;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            text-align: center;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #10B981;
        }

        .btn-secondary:hover {
            background-color: #059669;
        }

        .btn-gray {
            background-color: #6B7280;
        }

        .btn-gray:hover {
            background-color: #4B5563;
        }
        
        .option-btn {
            display: block;
            width: 100%;
            margin: 0.75rem 0;
            padding: 1.2rem;
            background-color: #F3F4F6;
            color: var(--text);
            font-size: 1.1rem;
            border-radius: 0.5rem;
            border: 2px solid transparent;
            transition: all 0.2s;
            word-break: keep-all;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) { 
            background-color: #E5E7EB; 
            border-color: var(--primary); 
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.95;
        }

        #explanation-container {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 0.5rem;
            background: #F9FAFB;
            border: 2px solid #E5E7EB;
            text-align: left;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0 0 2rem 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .leaderboard-list li {
            background: #F9FAFB;
            margin-bottom: 1rem;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid #E5E7EB;
        }

        .rank-1 {
            border-color: #FBBF24 !important;
            background-color: #FEF3C7 !important;
            color: #D97706;
        }

        .rank-2 {
            border-color: #9CA3AF !important;
            background-color: #F3F4F6 !important;
        }

        .rank-3 {
            border-color: #D97706 !important;
            background-color: #FFEDD5 !important;
            color: #9A3412;
        }

        .admin-btn { 
            position: absolute; 
            top: 1rem; 
            left: 1rem; 
            background: transparent; 
            color: #9CA3AF; 
            padding: 0.5rem; 
            font-size: 0.9rem; 
        }

        .admin-btn:hover {
            background: #E5E7EB;
            color: var(--text);
        }

        .admin-q-box {
            background: #F9FAFB;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #E5E7EB;
            text-align: left;
        }

        .admin-q-box input,
        .admin-q-box textarea { 
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
            margin: 0.5rem 0;
            border: 1px solid #D1D5DB;
            text-align: left; 
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
        }

        .delete-btn {
            background-color: #EF4444;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 600px) {
            .card {
                padding: 2rem 1rem;
                margin: 0.5rem auto;
            }

            h1 {
                font-size: 1.6rem;
            }

            h2 {
                font-size: 1.25rem;
            }
            
            input[type="text"], textarea {
                width: 95%;
                padding: 0.8rem;
                font-size: 1rem;
                margin: 1rem 0;
            }
            
            button {
                width: 100%;
                margin: 0.4rem 0;
                font-size: 1.1rem;
                padding: 0.8rem;
            }
            
            .option-btn {
                padding: 1rem;
                font-size: 1.05rem;
            }
            
            #explanation-container {
                padding: 1rem;
            }

            #result-title {
                font-size: 1.2rem !important;
            }

            #explanation-text {
                font-size: 1rem !important;
            }
            
            .leaderboard-list li {
                font-size: 1rem;
                padding: 0.8rem 1rem;
            }
            
            #final-score {
                font-size: 2rem !important;
                margin: 1.5rem 0 !important;
            }
            
            .modal-content {
                width: 95%;
                padding: 1.5rem 1rem;
            }
            
            .admin-btn {
                top: 0.5rem;
                left: 0.5rem;
                width: auto;
            }
        }
    </style>
</head>

<body>

    <!-- 1. 시작 화면 -->
    <div class="card" id="start-screen">

        <button class="admin-btn" onclick="openAdmin()">
            ⚙️ 관리자
        </button>

        <h1>🤝 장애이해교육 퀴즈</h1>

        <p style="font-size: 1.2rem; color: #6B7280; margin-bottom: 2rem;">
            선생님의 성함을 입력하고 퀴즈를 시작하세요!
        </p>

        <input
            type="text"
            id="username"
            maxlength="20"
            placeholder="성함 또는 닉네임"
            autocomplete="off"
            onkeypress="handleEnter(event)"
        >

        <br>

        <button onclick="startGame()">
            도전 시작하기
        </button>

        <button class="btn-secondary" onclick="openLeaderboard()">
            🏆 명예의 전당 보기
        </button>

    </div>


    <!-- 2. 퀴즈 진행 화면 -->
    <div class="card hidden" id="quiz-screen">

        <div
            id="question-number"
            style="
                background: var(--primary);
                color: white;
                display: inline-block;
                padding: 0.5rem 1rem;
                border-radius: 2rem;
                margin-bottom: 1rem;
                font-weight: bold;
            "
        >
            문제 1
        </div>

        <h2 id="question-text"></h2>

        <div id="options-container"></div>
        
        <div id="explanation-container" class="hidden">

            <h3
                id="result-title"
                style="margin-top: 0; font-size: 1.4rem;"
            ></h3>

            <p
                id="explanation-text"
                style="
                    line-height: 1.6;
                    color: #4B5563;
                    font-size: 1.1rem;
                    margin-bottom: 1.5rem;
                    word-break: keep-all;
                "
            ></p>

            <button
                id="next-btn"
                onclick="nextQuestion()"
                style="width: 100%; margin: 0;"
            >
                다음 문제로
            </button>

        </div>

    </div>


    <!-- 3. 결과 화면 -->
    <div class="card hidden" id="result-screen">

        <h1>🎉 수고하셨습니다!</h1>

        <p
            id="final-score"
            style="
                font-size: 2.5rem;
                font-weight: bold;
                color: var(--primary);
                margin: 2rem 0;
            "
        ></p>

        <p
            id="score-detail"
            style="
                color:#6B7280;
                line-height:1.6;
                margin-bottom:1.5rem;
            "
        ></p>

        <button onclick="resetToStart()">
            처음으로 돌아가기
        </button>

        <button class="btn-secondary" onclick="openLeaderboard()">
            🏆 명예의 전당 보기
        </button>

    </div>


    <!-- 4. 명예의 전당 -->
    <div class="card hidden" id="leaderboard-screen">

        <h1>🏆 명예의 전당</h1>

        <ul id="leaderboard" class="leaderboard-list"></ul>

        <button class="btn-gray" onclick="resetToStart()">
            돌아가기
        </button>

        <button
            style="
                background: #EF4444;
                font-size: 1rem;
                padding: 1rem;
            "
            onclick="clearLeaderboard()"
        >
            순위 초기화
        </button>

    </div>


    <!-- 관리자 모달 -->
    <div id="admin-modal" class="modal-overlay hidden">

        <div class="modal-content">

            <div style="display: flex; justify-content: space-between; align-items: center;">

                <h2>⚙️ 문제 관리 (관리자 전용)</h2>

                <button
                    class="btn-gray"
                    onclick="closeAdmin()"
                    style="padding: 0.5rem 1rem;"
                >
                    닫기
                </button>

            </div>

            <p
                style="
                    color: #EF4444;
                    text-align: left;
                    font-weight: bold;
                    font-size: 0.95rem;
                "
            >
                🚨 보기는 반드시 수직선( | )으로 구분하여 입력하세요.<br>
                (보기 문장 안에 쉼표가 들어갈 수 있으므로 | 기호를 사용합니다. Shift + \ 키 입력)
            </p>
            
            <div id="admin-questions"></div>
            
            <div
                style="
                    margin-top: 2rem;
                    display: flex;
                    justify-content: center;
                    gap: 1rem;
                    flex-wrap: wrap;
                "
            >

                <button
                    class="btn-secondary"
                    onclick="addNewQuestion()"
                >
                    + 새 문제 추가
                </button>

                <button onclick="saveAdminChanges()">
                    저장 및 적용
                </button>

            </div>

        </div>

    </div>


<script>

        },

        {

            options: "영상의 음량만 크게 한다. | 음성, 자막, 그림이나 쉬운 설명 등 여러 방법으로 정보를 제공한다. | 영상만 보여주고 필요한 사람에게 나중에 설명한다. | 모든 사람에게 글로만 안내한다.", 
            answer: "음성, 자막, 그림이나 쉬운 설명 등 여러 방법으로 정보를 제공한다.",
            explanation: "사람마다 정보를 이해하고 받아들이는 방법이 다릅니다. 따라서 중요한 정보는 글·소리·자막·쉬운 설명 등 다양한 방법으로 제공하는 것이 좋습니다."
        },

        { 
            text: "다음 중 ‘유니버설 디자인’을 가장 잘 설명한 것은 무엇일까요?", 
            options: "장애인이 요청할 때마다 시설을 따로 설치하는 것 | 장애인을 위한 전용 시설을 만드는 것 | 처음부터 가능한 많은 사람이 편리하게 사용할 수 있도록 환경과 제품을 설계하는 것 | 기존 시설의 장애물을 나중에 제거하는 것만을 의미하는 것", 
            answer: "처음부터 가능한 많은 사람이 편리하게 사용할 수 있도록 환경과 제품을 설계하는 것",
            explanation: "유니버설 디자인은 특정 사람만을 위한 설계가 아니라, 처음부터 가능한 많은 사람이 편리하게 이용하도록 만드는 것입니다."
        },

        { 
            text: "휠체어 사용자가 교실에 들어갈 수 없도록 높은 문턱이 있습니다. 이 문제를 해결하기 위해 문턱을 없앴습니다. 이와 가장 관련 있는 개념은 무엇일까요?", 
            options: "배리어프리 | 자립생활 | 장애유형 분류 | 분리교육", 
            answer: "배리어프리",
            explanation: "배리어프리는 장애인 등이 생활하는 데 방해가 되는 물리적·제도적 장벽을 없애는 것을 의미합니다."
        },

        { 
            text: "장애학생의 ‘자립’을 가장 올바르게 설명한 것은 무엇일까요?", 
            options: "다른 사람에게 전혀 도움받지 않고 모든 것을 혼자 하는 것이다. | 가능한 모든 일을 교사가 대신해 주는 것이다. | 필요한 도움을 받으면서 자신의 삶에 대해 스스로 선택하고 결정하는 것이다. | 혼자 할 수 없는 활동에는 참여하지 않는 것이다.", 
            answer: "필요한 도움을 받으면서 자신의 삶에 대해 스스로 선택하고 결정하는 것이다.",
            explanation: "자립은 모든 것을 혼자 해야 한다는 의미가 아닙니다. 누구나 다른 사람의 도움을 받으며 살아갑니다. 필요한 지원을 받으면서 자신의 삶을 선택하고 결정하는 것이 자립의 핵심입니다."
        }

    ];


    let questions = defaultQuestions;

    let scores = [];

    let currentUsername = "";
    let currentQuestionIndex = 0;

    // 최종 점수
    let currentScore = 0;

    // 맞힌 문제 수
    let correctCount = 0;

    // 속도 보너스 누적값
    let speedBonusTotal = 0;

    // 각 문제 시작 시간
    let questionStartTime = 0;

    // 중복 저장 방지
    let scoreSaved = false;


    // ==========================================
    // 3. Firebase 문제 실시간 연동
    // ==========================================

    db.collection('quiz_data')
      .doc('questions')
      .onSnapshot((doc) => {

        if (doc.exists) {

            questions = doc.data().list;

        } else {

            db.collection('quiz_data')
              .doc('questions')
              .set({
                  list: defaultQuestions
              })
              .catch((error) => {
                  console.log("기본 문제 저장 실패:", error);
              });

        }

    });


    // ==========================================
    // 4. 순위표 실시간 연동
    // ==========================================

    db.collection('quiz_scores')
      .onSnapshot((snapshot) => {

        scores = [];

        snapshot.forEach((doc) => {

            scores.push({
                id: doc.id,
                ...doc.data()
            });

        });


        // 점수 높은 순
        // 같은 점수면 먼저 완료한 사람 우선
        scores.sort((a, b) =>
            b.score - a.score ||
            a.time - b.time
        );


        if (
            !document
                .getElementById('leaderboard-screen')
                .classList
                .contains('hidden')
        ) {

            renderLeaderboard();

        }

    });


    // ==========================================
    // 5. 화면 제어
    // ==========================================

    function showScreen(screenId) {

        document
            .getElementById('start-screen')
            .classList.add('hidden');

        document
            .getElementById('quiz-screen')
            .classList.add('hidden');

        document
            .getElementById('result-screen')
            .classList.add('hidden');

        document
            .getElementById('leaderboard-screen')
            .classList.add('hidden');


        document
            .getElementById(screenId)
            .classList.remove('hidden');

    }


    function handleEnter(e) {

        if (e.key === 'Enter') {

            startGame();

        }

    }


    function resetToStart() {

        document
            .getElementById('username')
            .value = "";

        showScreen('start-screen');

        document
            .getElementById('username')
            .focus();

    }


    // ==========================================
    // 6. 퀴즈 시작
    // ==========================================

    function startGame() {

        const nameInput =
            document
                .getElementById('username')
                .value
                .trim();


        if (!nameInput) {

            alert(
                "선생님의 성함을 입력해주세요!"
            );

            return;

        }


        // 동일 이름 1회 참여 제한
        const existingRecord =
            scores.find(
                s => s.name === nameInput
            );


        if (existingRecord) {

            alert(
                "이미 참여하셨습니다. 한 번만 참여할 수 있습니다."
            );

            return;

        }


        currentUsername = nameInput;

        currentQuestionIndex = 0;

        currentScore = 0;

        correctCount = 0;

        speedBonusTotal = 0;

        questionStartTime = 0;

        scoreSaved = false;


        showScreen('quiz-screen');

        loadQuestion();

    }


    // ==========================================
    // 7. 문제 표시
    // ==========================================

    function loadQuestion() {

        if (
            !questions ||
            questions.length === 0
        ) {

            questions = defaultQuestions;

        }


        const q =
            questions[
                currentQuestionIndex
            ];


        document
            .getElementById('question-number')
            .innerText =
            `문제 ${currentQuestionIndex + 1} / ${questions.length}`;


        document
            .getElementById('question-text')
            .innerText =
            q.text;


        document
            .getElementById('explanation-container')
            .classList
            .add('hidden');


        const optsContainer =
            document
                .getElementById('options-container');


        optsContainer.innerHTML = "";


        const optionsArray =
            q.options
                .split('|')
                .map(
                    opt => opt.trim()
                );


        optionsArray.forEach(
            opt => {

                const btn =
                    document
                        .createElement('button');


                btn.className =
                    "option-btn";


                btn.innerText =
                    opt;


                btn.onclick =
                    (e) =>
                    submitAnswer(
                        opt,
                        q.answer.trim(),
                        e.target
                    );


                optsContainer
                    .appendChild(btn);

            }
        );


        // --------------------------------------
        // 문제 화면이 완성된 뒤 시간 측정 시작
        // --------------------------------------

        questionStartTime = Date.now();

    }


    // ==========================================
    // 8. 정답 처리 + 속도 보너스
    // ==========================================

    function submitAnswer(
        selected,
        correct,
        clickedBtn
    ) {

        // 버튼 중복 클릭 방지
        const buttons =
            document
                .querySelectorAll('.option-btn');


        buttons.forEach(
            btn => {

                btn.disabled = true;


                if (
                    btn.innerText === correct
                ) {

                    btn.style.backgroundColor =
                        '#10B981';

                    btn.style.color =
                        'white';

                    btn.style.borderColor =
                        '#10B981';

                }

                else if (
                    btn.innerText === selected &&
                    selected !== correct
                ) {

                    btn.style.backgroundColor =
                        '#EF4444';

                    btn.style.color =
                        'white';

                    btn.style.borderColor =
                        '#EF4444';

                }

            }
        );


        const resultTitle =
            document
                .getElementById('result-title');


        if (
            selected === correct
        ) {

            // ----------------------------------
            // 정답 개수
            // ----------------------------------

            correctCount++;


            // ----------------------------------
            // 걸린 시간 계산
            // ----------------------------------

            const elapsedSeconds =
                (Date.now() - questionStartTime) / 1000;


            // ----------------------------------
            // 속도 보너스
            //
            // 5초 이하     100%
            // 10초 이하     70%
            // 15초 이하     40%
            // 20초 이하     20%
            // 20초 초과      0%
            // ----------------------------------

            let speedRate = 0;


            if (
                elapsedSeconds <= 5
            ) {

                speedRate = 1.0;

            }

            else if (
                elapsedSeconds <= 10
            ) {

                speedRate = 0.7;

            }

            else if (
                elapsedSeconds <= 15
            ) {

                speedRate = 0.4;

            }

            else if (
                elapsedSeconds <= 20
            ) {

                speedRate = 0.2;

            }

            else {

                speedRate = 0;

            }


            speedBonusTotal += speedRate;


            resultTitle.innerText =
                "⭕ 정답입니다!";


            resultTitle.style.color =
                "#10B981";

        }

        else {

            // 오답은 속도 보너스 없음

            resultTitle.innerText =
                "❌ 틀렸습니다.";


            resultTitle.style.color =
                "#EF4444";

        }


        document
            .getElementById('explanation-text')
            .innerText =
            questions[
                currentQuestionIndex
            ].explanation ||
            "해설이 등록되지 않았습니다.";


        document
            .getElementById('explanation-container')
            .classList
            .remove('hidden');


        const nextBtn =
            document
                .getElementById('next-btn');


        if (
            currentQuestionIndex ===
            questions.length - 1
        ) {

            nextBtn.innerText =
                "결과 확인하기";

        }

        else {

            nextBtn.innerText =
                "다음 문제로";

        }

    }


    // ==========================================
    // 9. 다음 문제
    // ==========================================

    function nextQuestion() {

        currentQuestionIndex++;


        if (
            currentQuestionIndex >=
            questions.length
        ) {

            endGame();

        }

        else {

            loadQuestion();

        }

    }


    // ==========================================
    // 10. 최종 점수 계산
    //
    // 정확도 최대 900점
    // 속도 최대 100점
    // 총점 최대 1000점
    // ==========================================

    function endGame() {

        // 중복 저장 방지
        if (scoreSaved) {
            return;
        }


        scoreSaved = true;


        // --------------------------------------
        // 정확도 점수
        // --------------------------------------

        const accuracyScore =
            Math.round(
                (
                    correctCount /
                    questions.length
                ) * 900
            );


        // --------------------------------------
        // 속도 보너스 점수
        // --------------------------------------

        const speedScore =
            Math.round(
                (
                    speedBonusTotal /
                    questions.length
                ) * 100
            );


        // --------------------------------------
        // 최종 점수
        // --------------------------------------

        currentScore =
            accuracyScore +
            speedScore;


        if (
            currentScore > 1000
        ) {

            currentScore = 1000;

        }


        showScreen('result-screen');


        document
            .getElementById('final-score')
            .innerText =
            `${currentScore}점`;


document
    .getElementById('score-detail')
    .innerText =
    `정답 ${correctCount} / ${questions.length}개`;


        // --------------------------------------
        // Firebase 저장
        // --------------------------------------

        db.collection('quiz_scores')
          .add({

              name:
                  currentUsername,

              score:
                  currentScore,

              time:
                  Date.now(),

              attempts:
                  1

          })

          .catch(
              (error) => {

                  console.error(
                      "점수 저장 오류:",
                      error
                  );


                  alert(
                      "점수 저장에 실패했습니다."
                  );

              }
          );

    }


    // ==========================================
    // 11. 순위표
    // ==========================================

    function openLeaderboard() {

        renderLeaderboard();

        showScreen(
            'leaderboard-screen'
        );

    }


    function renderLeaderboard() {

        const lbContainer =
            document
                .getElementById('leaderboard');


        lbContainer.innerHTML = "";


        if (
            scores.length === 0
        ) {

            lbContainer.innerHTML =
                "<li style='justify-content:center; color:#9CA3AF;'>아직 참여자가 없습니다.</li>";

            return;

        }


        scores.forEach(
            (entry, idx) => {

                const li =
                    document
                        .createElement('li');


                let rankClass = "";


                if (idx === 0) {

                    rankClass =
                        "rank-1";

                }

                else if (idx === 1) {

                    rankClass =
                        "rank-2";

                }

                else if (idx === 2) {

                    rankClass =
                        "rank-3";

                }


                li.className =
                    rankClass;


                let medal =
                    idx + 1 + "위";


                if (idx === 0) {

                    medal =
                        "🥇 1위";

                }

                if (idx === 1) {

                    medal =
                        "🥈 2위";

                }

                if (idx === 2) {

                    medal =
                        "🥉 3위";

                }


                const left =
                    document.createElement('span');


                const strong =
                    document.createElement('strong');


                strong.textContent =
                    entry.name;


                left.appendChild(
                    document.createTextNode(
                        medal + "   "
                    )
                );


                left.appendChild(
                    strong
                );


                const right =
                    document.createElement('span');


                right.textContent =
                    `${entry.score}점`;


                li.appendChild(left);

                li.appendChild(right);

                lbContainer.appendChild(li);

            }
        );

    }


    // ==========================================
    // 12. 순위 초기화
    // ==========================================

    function clearLeaderboard() {

        if (
            confirm(
                "정말로 모든 순위 기록을 삭제하시겠습니까? (복구 불가)"
            )
        ) {

            const pw =
                prompt(
                    "관리자 비밀번호를 입력하세요:"
                );


            if (
                pw === ADMIN_PW
            ) {

                db.collection('quiz_scores')
                  .get()
                  .then(
                      snapshot => {

                          const batch =
                              db.batch();


                          snapshot.forEach(
                              doc => {

                                  batch.delete(
                                      doc.ref
                                  );

                              }
                          );


                          return batch.commit();

                      }
                  )

                  .then(
                      () => {

                          alert(
                              "초기화 되었습니다."
                          );

                      }
                  )

                  .catch(
                      (error) => {

                          console.error(
                              "순위 초기화 오류:",
                              error
                          );


                          alert(
                              "순위 초기화에 실패했습니다."
                          );

                      }
                  );

            }

            else {

                alert(
                    "비밀번호가 틀렸습니다."
                );

            }

        }

    }


    // ==========================================
    // 13. 관리자 모드
    // ==========================================

    function openAdmin() {

        const pw =
            prompt(
                "관리자 비밀번호를 입력하세요:"
            );


        if (
            pw === ADMIN_PW
        ) {

            document
                .getElementById('admin-modal')
                .classList
                .remove('hidden');


            renderAdminQuestions();

        }

        else if (
            pw !== null
        ) {

            alert(
                "비밀번호가 일치하지 않습니다."
            );

        }

    }


    function closeAdmin() {

        document
            .getElementById('admin-modal')
            .classList
            .add('hidden');

    }


    // ==========================================
    // 14. 관리자 문제 목록
    // ==========================================

    function renderAdminQuestions() {

        const container =
            document
                .getElementById('admin-questions');


        container.innerHTML = "";


        questions.forEach(
            (q, index) => {

                const div =
                    document
                        .createElement('div');


                div.className =
                    "admin-q-box";


                div.innerHTML = `

                    <div style="display:flex; justify-content:space-between; align-items:center;">

                        <label style="font-weight:bold; color:var(--primary);">
                            문제 ${index + 1}
                        </label>

                        <button
                            class="delete-btn"
                            onclick="deleteQuestion(${index})"
                        >
                            삭제
                        </button>

                    </div>


                    <label style="display:block; margin-top:0.5rem; font-size:0.9rem;">
                        질문
                    </label>

                    <input
                        type="text"
                        id="edit-text-${index}"
                    />


                    <label style="display:block; margin-top:0.5rem; font-size:0.9rem; color:#EF4444; font-weight:bold;">
                        보기 (수직선 '|' 로 구분)
                    </label>

                    <input
                        type="text"
                        id="edit-opts-${index}"
                        placeholder="예: O | X 또는 보기1 | 보기2 | 보기3 | 보기4"
                    />


                    <label style="display:block; margin-top:0.5rem; font-size:0.9rem;">
                        정답 (보기 중 하나와 텍스트 일치)
                    </label>

                    <input
                        type="text"
                        id="edit-ans-${index}"
                    />


                    <label style="display:block; margin-top:0.5rem; font-size:0.9rem;">
                        해설 (문제 풀이 후 제공)
                    </label>

                    <textarea
                        id="edit-exp-${index}"
                        rows="3"
                    ></textarea>

                `;


                container
                    .appendChild(div);


                document
                    .getElementById(
                        `edit-text-${index}`
                    )
                    .value =
                    q.text;


                document
                    .getElementById(
                        `edit-opts-${index}`
                    )
                    .value =
                    q.options;


                document
                    .getElementById(
                        `edit-ans-${index}`
                    )
                    .value =
                    q.answer;


                document
                    .getElementById(
                        `edit-exp-${index}`
                    )
                    .value =
                    q.explanation || "";

            }
        );

    }


    // ==========================================
    // 15. 문제 추가
    // ==========================================

    function addNewQuestion() {

        questions.push({

            text:
                "새로운 문제입니다.",

            options:
                "O | X",

            answer:
                "O",

            explanation:
                "해설을 입력해주세요."

        });


        renderAdminQuestions();


        const container =
            document
                .getElementById('admin-questions');


        setTimeout(
            () => {

                container.scrollTop =
                    container.scrollHeight;

            },
            10
        );

    }


    // ==========================================
    // 16. 문제 삭제
    // ==========================================

    function deleteQuestion(index) {

        if (
            confirm(
                "이 문제를 삭제하시겠습니까?"
            )
        ) {

            questions.splice(
                index,
                1
            );


            renderAdminQuestions();

        }

    }


    // ==========================================
    // 17. 관리자 문제 저장
    // ==========================================

    function saveAdminChanges() {

        questions.forEach(
            (q, index) => {

                q.text =
                    document
                        .getElementById(
                            `edit-text-${index}`
                        )
                        .value;


                q.options =
                    document
                        .getElementById(
                            `edit-opts-${index}`
                        )
                        .value;


                q.answer =
                    document
                        .getElementById(
                            `edit-ans-${index}`
                        )
                        .value;


                q.explanation =
                    document
                        .getElementById(
                            `edit-exp-${index}`
                        )
                        .value;

            }
        );


        db.collection('quiz_data')
          .doc('questions')
          .set({

              list:
                  questions

          })

          .then(
              () => {

                  alert(
                      "문제가 성공적으로 업데이트 되었습니다."
                  );


                  closeAdmin();

              }
          )

          .catch(
              (error) => {

                  console.error(
                      "문제 저장 오류:",
                      error
                  );


                  alert(
                      "문제 저장에 실패했습니다."
                  );

              }
          );

    }

</script>
